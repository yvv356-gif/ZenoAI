name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compiler l'APK
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Donner les permissions d execution a Gradlew
        run: chmod +x gradlew
        working-directory: ./ZenoAI

      - name: Compiler l'APK Debug
        run: ./gradlew assembleDebug
        working-directory: ./ZenoAI

      - name: Sauvegarder l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: zeno-debug-apk
          path: ZenoAI/app/build/outputs/apk/debug/app-debug.apk
          
