name: Build ZenoAI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pas de gradlew dans le projet : on installe Gradle directement
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Le shell de jeu est embarqué dans l'app (assets/game-shell.apk)
      - name: Compiler le shell de jeu
        run: |
          gradle :gameshell:assembleRelease --no-daemon --console=plain
          mkdir -p app/src/main/assets
          cp gameshell/build/outputs/apk/release/*.apk app/src/main/assets/game-shell.apk

      - name: Compiler l'APK release
        run: gradle :app:assembleRelease --no-daemon --console=plain --stacktrace

      - name: Enregistrer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenoAI-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
