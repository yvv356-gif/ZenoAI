name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract ZIP (if present)
      run: |
        ZIP=$(find . -maxdepth 3 -type f -iname "ZenoAI*.zip" -not -path "./.git/*" | head -n 1)
        if [ -n "$ZIP" ]; then
          echo "Extracting $ZIP"
          mkdir -p extracted
          unzip -o -q "$ZIP" -d extracted
        else
          echo "No ZIP found, using repository files as is"
        fi

    - name: Locate Android project
      run: |
        SETTINGS=$(find . -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
          -not -path "./.git/*" -not -path "*/build/*" | head -n 1)
        if [ -z "$SETTINGS" ]; then
          echo "::error::No settings.gradle(.kts) found"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$SETTINGS")
        echo "Project directory: $PROJECT_DIR"
        echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

    - name: Apply build fixes
      working-directory: ${{ env.PROJECT_DIR }}
      run: |
        # Root build file with plugin versions
        cat > build.gradle.kts <<'EOF'
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        # gradle.properties
        cat > gradle.properties <<'EOF'
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        kotlin.code.style=official
        android.nonTransitiveRClass=true
        EOF

        # Theme
        mkdir -p app/src/main/res/values app/src/main/res/drawable
        cat > app/src/main/res/values/themes.xml <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.ZenoAI" parent="android:Theme.Material.Light.NoActionBar" />
        </resources>
        EOF

        # Launcher icon
        cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#6C4DFF" android:pathData="M0,0h108v108h-108z" />
            <path android:fillColor="#FFFFFF" android:pathData="M34,34h40v8L46,66h28v8H34v-8l28,-24H34z" />
        </vector>
        EOF

        # Manifest fixes (idempotent)
        MANIFEST=app/src/main/AndroidManifest.xml
        sed -i 's/\\\${applicationId}/${applicationId}/g' "$MANIFEST"
        sed -i 's#@mipmap/ic_launcher#@drawable/ic_launcher#g' "$MANIFEST"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      working-directory: ${{ env.PROJECT_DIR }}
      run: gradle assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
