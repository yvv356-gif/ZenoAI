name: Build ZenoAI
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Installer CMake et NDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "ndk;26.1.10909125" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      # 1) Modèle d'APK "jeu"
      - run: gradle :gametemplate:assembleDebug --no-daemon
      - run: |
          mkdir -p app/src/main/assets
          cp gametemplate/build/outputs/apk/debug/gametemplate-debug.apk app/src/main/assets/game_template.apk
          # 2) Clé de signature des APK de jeux
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/k.pem -out /tmp/c.pem -days 10000 -subj "/CN=ZenoAI"
          openssl pkcs8 -topk8 -nocrypt -in /tmp/k.pem -outform DER -out app/src/main/assets/sign_key.pk8
          openssl x509 -in /tmp/c.pem -outform DER -out app/src/main/assets/sign_cert.der
      # 3) L'application
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZenoAI-apk
          path: app/build/outputs/apk/debug/*.apk
