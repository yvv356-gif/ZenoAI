name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compiler l'APK
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Compiler le projet Android
        run: |
          if [ -d "ZenoAI" ]; then
            cd ZenoAI
          fi

          if [ ! -f "gradlew" ]; then
            echo "Generation du wrapper Gradle..."
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sauvegarder l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: zeno-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          
