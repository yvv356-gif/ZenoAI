name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compiler l'APK
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Compiler le projet Android
        run: |
          echo "Affichage de l'arborescence pour localiser les fichiers :"
          find . -maxdepth 3

          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Erreur : Fichier de configuration introuvable dans le depot."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Dossier du projet identifie : $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "Generation du wrapper Gradle..."
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sauvegarder l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: zeno-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          
