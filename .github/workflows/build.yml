name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compiler et Publier l'APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: ☕ Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Configurer Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔑 Donner les permissions d'exécution à Gradlew
        run: chmod +x gradlew

      - name: 📦 Compiler l'APK Debug
        run: ./gradlew assembleDebug

      - name: 📦 Compiler l'APK Release (si configuré)
        run: ./gradlew assembleRelease || true

      - name: 📤 Sauvegarder l'artefact Debug
        uses: actions/upload-artifact@v4
        with:
          name: zeno-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 📤 Sauvegarder l'artefact Release
        uses: actions/upload-artifact@v4
        with:
          name: zeno-app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: 🚀 Créer une Release GitHub (sur tag vX.Y)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
