name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compiler l'APK
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Extraire l'archive ZIP et compiler
        run: |
          echo "Recherche du fichier ZIP dans le depot..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "Erreur : Aucun fichier ZIP trouve dans le depot."
            exit 1
          fi
          
          echo "Archive trouvee : $ZIP_FILE. Extraction en cours..."
          unzip -q "$ZIP_FILE" -d extracted_project
          
          SETTINGS_FILE=$(find extracted_project -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Erreur : Fichier de configuration introuvable dans l'archive."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Dossier du projet extrait : $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          if [ ! -f "gradlew" ]; then
            echo "Generation du wrapper Gradle..."
            gradle wrapper --gradle-version 8.9
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sauvegarder l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: zeno-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          
