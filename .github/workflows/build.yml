name: Build ZenoAI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ZenoAI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          build-root-directory: ZenoAI

      - name: Compiler le shell de jeu
        run: |
          gradle :gameshell:assembleRelease --no-daemon --console=plain
          mkdir -p app/src/main/assets
          cp gameshell/build/outputs/apk/release/*.apk app/src/main/assets/game-shell.apk

      - name: Compiler l'APK release
        run: gradle :app:assembleRelease --no-daemon --console=plain --stacktrace

      - name: Enregistrer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenoAI-apk
          path: ZenoAI/app/build/outputs/apk/release/*.apk
          retention-days: 14
