name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Extraire et Compiler l'APK
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extraire l'archive et compiler
        run: |
          echo "Recherche d'une archive ZIP dans le depot..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Archive trouvee : $ZIP_FILE. Extraction en cours..."
            unzip -q "$ZIP_FILE" -d extracted_project
          else
            echo "Aucune archive ZIP trouvee, utilisation du repertoire courant."
            mkdir -p extracted_project
            cp -r !(extracted_project) extracted_project/ 2>/dev/null || true
          fi
          
          # Localiser automatiquement le dossier contenant gradlew
          GRADLEW_PATH=$(find extracted_project -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Dossier du projet localise : $PROJECT_DIR"
            cd "$PROJECT_DIR"
          else
            echo "Erreur : Impossible de trouver le fichier gradlew."
            exit 1
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sauvegarder l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: zeno-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          
