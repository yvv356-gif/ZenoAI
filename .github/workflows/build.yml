name: Build ZenoAI APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Le workflow cherche lui-même le zip du projet et l'extrait
      - name: Extraire le zip du projet
        id: proj
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          while IFS= read -r z; do
            if [ "$(unzip -Z1 "$z" | grep -c 'settings.gradle.kts$')" -gt 0 ]; then
              ZIP="$z"
            fi
          done < <(find . -name '*.zip' -not -path './.git/*' | sort)

          if [ -z "$ZIP" ]; then
            echo "::error::Aucun .zip contenant settings.gradle.kts trouvé dans le dépôt"
            exit 1
          fi
          echo "Zip utilisé : $ZIP (le dernier par ordre alphabétique : nomme-les ZenoAI-v18, v19…)"

          rm -rf _src && mkdir _src
          unzip -q "$ZIP" -d _src

          SETTINGS=$(find _src -name settings.gradle.kts -not -path '*/build/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts introuvable après extraction"
            exit 1
          fi
          PROJ_DIR=$(dirname "$SETTINGS")
          echo "Projet trouvé dans : $PROJ_DIR"
          echo "dir=$PROJ_DIR" >> "$GITHUB_OUTPUT"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer le SDK Android (plateforme 35)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1); fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler le shell de jeu (export APK des jeux)
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          if [ -d gameshell ]; then
            gradle :gameshell:assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
            mkdir -p app/src/main/assets
            cp gameshell/build/outputs/apk/release/*.apk app/src/main/assets/game-shell.apk
          else
            echo "Pas de module gameshell : étape ignorée" | tee build.log
          fi

      - name: Compiler l'APK debug
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee -a build.log

      - name: Compiler l'APK release (signé avec la clé debug, installable)
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee -a build.log

      - name: Afficher les erreurs de compilation
        if: failure()
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          {
            echo "## Erreurs de compilation"
            echo '```'
            grep -E '^e: |FAILED|What went wrong' -A3 build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: ' build.log | head -40 || true

      - name: Publier le journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.proj.outputs.dir }}/build.log
          if-no-files-found: ignore

      - name: Publier les APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenoAI-apk
          path: |
            ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Créer une release GitHub (sur tag vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
