name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du dépôt
      uses: actions/checkout@v4

    - name: Extraire l'archive ZIP et structurer à la racine
      run: |
        echo "--- Dossier avant extraction ---"
        ls -la
        if [ -f "ZenoAI-v2.zip" ]; then
          mkdir -p temp_extracted
          unzip -o ZenoAI-v2.zip -d temp_extracted
          
          # Si le zip contient un dossier ZenoAI, on extrait son contenu à la racine
          if [ -d "temp_extracted/ZenoAI" ]; then
            cp -a temp_extracted/ZenoAI/. .
          else
            cp -a temp_extracted/. .
          fi
          rm -rf temp_extracted
          # On supprime le dossier ZenoAI s'il a été recréé par erreur
          rm -rf ZenoAI
        fi
        echo "--- Dossier après extraction ---"
        ls -la

    - name: Configurer JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Forcer Gradle 8.5 et générer le Wrapper
      run: |
        mkdir -p gradle/wrapper
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        
        sudo apt-get update && sudo apt-get install -y gradle
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    - name: Compiler l'APK Debug
      run: ./gradlew assembleDebug --no-daemon

    - name: Téléverser l'APK en artefact
      uses: actions/upload-artifact@v4
      with:
        name: ZenoAI-v2-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
