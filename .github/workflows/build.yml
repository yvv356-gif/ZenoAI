name: Build ZenoAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Trouver et extraire le ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun fichier ZIP trouvé."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/zeno-src"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/zeno-src"

          echo "ZIP extrait : $ZIP_FILE"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compiler APK
        run: |
          PROJECT_DIR=$(find "$RUNNER_TEMP/zeno-src" \
            -name settings.gradle \
            -o -name settings.gradle.kts | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : projet Gradle introuvable."
            exit 1
          fi

          cd "$PROJECT_DIR"

          gradle assembleDebug assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Récupérer les APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenoAI-APK
          path: |
            ${{ runner.temp }}/zeno-src/**/*.apk
          if-no-files-found: error
