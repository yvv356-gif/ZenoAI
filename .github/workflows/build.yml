name: Build ZenoAI
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trouver et extraire le projet
        run: |
          # Décompresse les zip du dépôt (ex. ZenoAI.zip)
          find . -maxdepth 3 -name '*.zip' -not -path './_zip/*' | while read z; do
            unzip -oq "$z" -d _zip
          done
          S=$(find . -name settings.gradle.kts -not -path '*/build/*' | head -1)
          if [ -z "$S" ]; then echo "settings.gradle.kts introuvable"; find . -maxdepth 3 | head -50; exit 1; fi
          D=$(cd "$(dirname "$S")" && pwd)
          echo "Projet trouvé : $D"
          echo "PROJECT_DIR=$D" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Installer CMake et NDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "ndk;26.1.10909125" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }

      - name: Modèle d'APK jeu
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :gametemplate:assembleDebug --no-daemon

      - name: Clé de signature et assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/main/assets
          cp gametemplate/build/outputs/apk/debug/gametemplate-debug.apk app/src/main/assets/game_template.apk
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/k.pem -out /tmp/c.pem -days 10000 -subj "/CN=ZenoAI"
          openssl pkcs8 -topk8 -nocrypt -in /tmp/k.pem -outform DER -out app/src/main/assets/sign_key.pk8
          openssl x509 -in /tmp/c.pem -outform DER -out app/src/main/assets/sign_cert.der

      - name: Compiler l'application
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ZenoAI-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
