name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du dépôt
      uses: actions/checkout@v3

    - name: Extraire l'archive ZIP du projet ZenoAI
      run: |
        if [ -f "ZenoAI-v2.zip" ]; then
          echo "Extraction de ZenoAI-v2.zip..."
          unzip -o ZenoAI-v2.zip -d extracted_project
          # Si le ZIP contient un sous-dossier ZenoAI, on déplace tout à la racine du workspace
          if [ -d "extracted_project/ZenoAI" ]; then
            cp -r extracted_project/ZenoAI/* .
          else
            cp -r extracted_project/* .
          fi
          rm -rf extracted_project
        else
          echo "Fichier ZenoAI-v2.zip introuvable à la racine, poursuite avec la structure existante."
        fi

    - name: Configurer JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Générer le wrapper Gradle (si absent) et accorder les permissions
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Compiler l'APK Debug avec Gradle
      run: ./gradlew assembleDebug --no-daemon

    - name: Téléverser l'APK compilé en artefact
      uses: actions/upload-artifact@v3
      with:
        name: ZenoAI-v2-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
