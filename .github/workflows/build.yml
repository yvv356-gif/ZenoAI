name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du dépôt
      uses: actions/checkout@v4

    - name: Extraire l'archive ZIP du projet ZenoAI
      run: |
        echo "=== Fichiers initiaux dans le workspace ==="
        ls -la
        if [ -f "ZenoAI-v2.zip" ]; then
          echo "Extraction de ZenoAI-v2.zip..."
          mkdir -p temp_extracted
          unzip -o ZenoAI-v2.zip -d temp_extracted
          
          echo "=== Contenu extrait ==="
          ls -la temp_extracted
          
          # Si le ZIP contient un dossier ZenoAI, on en extrait le contenu à la racine
          if [ -d "temp_extracted/ZenoAI" ]; then
            echo "Copie des fichiers depuis le dossier ZenoAI..."
            cp -av temp_extracted/ZenoAI/. .
          else
            echo "Copie directe des fichiers..."
            cp -av temp_extracted/. .
          fi
          
          rm -rf temp_extracted
          echo "=== Fichiers après extraction à la racine ==="
          ls -la
        else
          echo "Erreur : ZenoAI-v2.zip est introuvable à la racine du dépôt !"
          exit 1
        fi

    - name: Configurer JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accorder les permissions d'exécution à gradlew
      run: |
        chmod +x gradlew

    - name: Compiler l'APK Debug
      run: ./gradlew assembleDebug --no-daemon

    - name: Téléverser l'APK en artefact
      uses: actions/upload-artifact@v4
      with:
        name: ZenoAI-v2-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
