name: Build ZenoAI APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Le projet peut être directement dans le dépôt, ou dans un .zip (le plus récent est utilisé)
      - name: Trouver le projet
        id: proj
        run: |
          set -e
          if [ -f settings.gradle.kts ]; then
            echo "Projet trouvé à la racine du dépôt"
            echo "dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          best=$(python3 - <<'PY'
          import glob, subprocess, zipfile
          best = None
          for z in glob.glob('**/*.zip', recursive=True):
              try:
                  zf = zipfile.ZipFile(z)
              except Exception:
                  continue
              if not any(n.endswith('settings.gradle.kts') for n in zf.namelist()):
                  continue
              try:
                  t = int(subprocess.check_output(['git', 'log', '-1', '--format=%ct', '--', z]).strip() or 0)
              except Exception:
                  t = 0
              newest = max((i.date_time for i in zf.infolist()), default=(0,))
              key = (t, newest)
              if best is None or key > best[0]:
                  best = (key, z)
          print(best[1] if best else '')
          PY
          )
          if [ -z "$best" ]; then
            echo "Aucun projet trouvé (ni settings.gradle.kts, ni .zip contenant le projet)."
            exit 1
          fi
          echo "Zip utilisé : $best"
          rm -rf _src && mkdir _src
          unzip -q "$best" -d _src
          f=$(find _src -name settings.gradle.kts -not -path '*/build/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer le SDK Android (plateforme 35)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1); fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler le shell de jeu (export APK des jeux)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -o pipefail
          gradle :gameshell:assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
          mkdir -p app/src/main/assets
          cp gameshell/build/outputs/apk/release/*.apk app/src/main/assets/game-shell.apk

      - name: Compiler l'APK debug
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee -a build.log

      - name: Compiler l'APK release (signé avec la clé debug, installable)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee -a build.log

      # En cas d'échec : les erreurs apparaissent dans le résumé du job et le journal complet est téléchargeable
      - name: Afficher les erreurs de compilation
        if: failure()
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          {
            echo "## Erreurs de compilation"
            echo '```'
            grep -E '^e: |error:|FAILED|What went wrong' -A3 build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: ' build.log | head -40 || true

      - name: Publier le journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.proj.outputs.dir }}/build.log
          if-no-files-found: ignore

      - name: Publier les APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenoAI-apk
          path: |
            ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk

      - name: Créer une release GitHub (sur tag vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
